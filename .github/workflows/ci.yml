name: Loose AI - Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * 0' # Weekly health audit

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Core Tests
      run: python tests/test_core.py
    - name: Global Health Audit
      run: python verify_health.py

  polyglot-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
    - name: Run Go Auditor
      run: go run polyglot_core/go_health_checker/main.go
    
    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
    - name: Verify Rust Module
      run: cd polyglot_core/rust_secure_compute && cargo check
